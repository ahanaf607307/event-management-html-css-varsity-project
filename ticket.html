<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Digital Ticket Pass | Eventify</title>
  
  <!-- FontAwesome, QRious (QR generator), & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/toast.css">
  
  <style>
    .ticket-page-container {
      padding: 60px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* VIP Boarding Pass Layout */
    .boarding-pass {
      width: 100%;
      max-width: 760px;
      border-radius: var(--border-radius-md);
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: 1fr 240px;
      position: relative;
    }

    .pass-left {
      background: var(--bg-secondary);
      border-right: 2px dashed rgba(255, 255, 255, 0.1);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .pass-right {
      background: #0b111e;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Circular notches representing ticket cutouts */
    .notch {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--bg-primary);
      border-radius: 50%;
      right: -12px;
      z-index: 10;
    }
    .notch-top { top: -12px; }
    .notch-bottom { bottom: -12px; }

    .ticket-banner {
      height: 120px;
      border-radius: var(--border-radius-sm);
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--glass-border);
    }
    .ticket-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ticket-details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .detail-item h5 {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .detail-item p {
      font-size: 15px;
      font-weight: 600;
    }

    .qr-canvas-wrapper {
      padding: 16px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }

    .ticket-bar-code {
      font-family: 'Libre Barcode 39', cursive, monospace;
      font-size: 32px;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-top: 20px;
    }

    /* Print styling rules */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      #header-nav, #footer-nav, .print-btn-bar {
        display: none !important;
      }
      .ticket-page-container {
        padding: 0 !important;
      }
      .boarding-pass {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        background: #fff !important;
      }
      .pass-left, .pass-right {
        background: #fff !important;
        color: #000 !important;
      }
      .detail-item p, .pass-left h2, .pass-left span {
        color: #000 !important;
      }
      .notch {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .boarding-pass {
        grid-template-columns: 1fr;
      }
      .pass-left {
        border-right: none;
        border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
      }
      .notch {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Navigation -->
  <header id="header-nav"></header>

  <div class="container">
    <div class="ticket-page-container">
      
      <!-- Action Bar -->
      <div class="print-btn-bar" style="width: 100%; max-width: 760px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 style="font-size: 24px;">Your Digital Pass</h2>
        <div style="display: flex; gap: 12px;">
          <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-th-large"></i> Go to Dashboard</a>
          <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print Ticket (PDF)</button>
        </div>
      </div>

      <!-- Ticket Boarding Pass Card -->
      <div class="boarding-pass glass-panel" id="ticket-pass-card">
        
        <!-- Notch Cutouts -->
        <div class="notch notch-top"></div>
        <div class="notch notch-bottom"></div>

        <!-- Left Details Panel -->
        <div class="pass-left">
          <div>
            <div class="ticket-banner">
              <img id="ticket-banner-img" src="" alt="Event Banner" onerror="this.src='https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?q=80&w=1000'">
            </div>
            
            <span class="badge badge-upcoming" id="ticket-category-lbl">Technology</span>
            <h2 style="font-size: 26px; margin-top: 10px; margin-bottom: 8px;" id="ticket-title-lbl">Event Title Loading...</h2>
            <p style="color: var(--text-secondary); font-size: 14px;"><i class="fas fa-map-marker-alt" style="color: var(--accent-primary);"></i> <span id="ticket-location-lbl">Location...</span></p>
          </div>

          <div class="ticket-details-grid">
            <div class="detail-item">
              <h5>Attendee Name</h5>
              <p id="ticket-attendee-lbl">...</p>
            </div>
            <div class="detail-item">
              <h5>Booking Code</h5>
              <p style="color: var(--accent-pink);" id="ticket-code-lbl">...</p>
            </div>
            <div class="detail-item">
              <h5>Date & Time</h5>
              <p id="ticket-datetime-lbl">...</p>
            </div>
            <div class="detail-item">
              <h5>Seating Passes</h5>
              <p id="ticket-seats-lbl">1 Seat Pass</p>
            </div>
          </div>
        </div>

        <!-- Right Scanner Panel -->
        <div class="pass-right">
          <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 16px;">Gate Entry Pass</p>
          
          <div class="qr-canvas-wrapper">
            <canvas id="qr-canvas"></canvas>
          </div>
          
          <span class="badge badge-pending" id="ticket-checkin-lbl">PENDING</span>
          
          <div style="margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
            <p>Payment: <strong id="ticket-payment-lbl">PAID</strong></p>
            <p id="ticket-method-lbl">CARD</p>
          </div>

          <div class="ticket-bar-code" id="ticket-barcode-lbl">*EVNT-2026*</div>
        </div>

      </div>

    </div>
  </div>

  <!-- Dynamic Footer Navigation -->
  <footer id="footer-nav"></footer>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    let bookingId = '';

    document.addEventListener('DOMContentLoaded', () => {
      // Direct URL check
      const params = new URLSearchParams(window.location.search);
      bookingId = params.get('id');

      if (!bookingId) {
        window.location.href = 'dashboard.html';
        return;
      }

      loadTicketDetails();
    });

    // Fetch single booking ticket pass details
    async function loadTicketDetails() {
      UI.showLoader();
      const res = await API.get(CONFIG.ENDPOINTS.BOOKINGS.MY_ONE_BOOKING(bookingId));
      UI.hideLoader();

      if (res.success && res.data) {
        const ticket = res.data;
        const evt = ticket.event || {};

        // Banner and texts
        document.getElementById('ticket-banner-img').src = evt.bannerUrl || 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?q=80&w=1000';
        document.getElementById('ticket-category-lbl').textContent = evt.category?.name || 'General';
        document.getElementById('ticket-title-lbl').textContent = evt.title;
        document.getElementById('ticket-location-lbl').textContent = evt.location;
        document.getElementById('ticket-attendee-lbl').textContent = ticket.user?.name || AUTH.getUser()?.name;
        document.getElementById('ticket-code-lbl').textContent = ticket.bookingCode;
        document.getElementById('ticket-datetime-lbl').textContent = `${UI.formatDate(evt.date)} @ ${evt.time}`;
        document.getElementById('ticket-seats-lbl').textContent = `${ticket.seatCount} Seat Pass${ticket.seatCount > 1 ? 'es' : ''}`;
        
        // Status Badges
        const statusLbl = document.getElementById('ticket-checkin-lbl');
        statusLbl.textContent = ticket.status === 'ATTENDED' ? 'CHECKED IN' : ticket.status;
        statusLbl.className = `badge ${ticket.status === 'ATTENDED' ? 'badge-completed' : (ticket.status === 'CANCELLED' ? 'badge-cancelled' : 'badge-pending')}`;

        const paymentLbl = document.getElementById('ticket-payment-lbl');
        paymentLbl.textContent = ticket.paymentStatus;
        paymentLbl.className = ticket.paymentStatus === 'PAID' ? 'text-success' : 'text-danger';
        document.getElementById('ticket-method-lbl').textContent = `via ${ticket.paymentMethod?.replace('_', ' ') || 'N/A'}`;
        document.getElementById('ticket-barcode-lbl').textContent = `*${ticket.bookingCode}*`;

        // Generate QR code pass containing booking code
        generateTicketQRCode(ticket.bookingCode);
      } else {
        UI.toast(res.message || 'Failed to load ticket pass details.', 'error');
      }
    }

    // Instantiation QRious QR canvas engine
    function generateTicketQRCode(codeText) {
      new QRious({
        element: document.getElementById('qr-canvas'),
        value: codeText,
        size: 150,
        background: '#ffffff',
        foreground: '#000000',
        level: 'H' // High correction
      });
    }
  </script>
</body>
</html>
